<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0B0E14" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F4F4F0" media="(prefers-color-scheme: light)">
{{- with .Site.Params.gtm_id }}
<script defer src="{{ "js/cookie-consent.js" | relURL }}" data-gtm-id="{{ . }}"></script>
{{- end }}
{{- partial "seo.html" . -}}
<link rel="icon" href="{{ "images/logo_mmi.png" | relURL }}" type="image/png">
<link rel="apple-touch-icon" href="{{ "images/logo_mmi.png" | relURL }}">
<script>
  (function () {
    var d = document.documentElement;
    d.classList.add('js');
    var saved = localStorage.getItem('theme');
    var prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
    d.setAttribute('data-theme', saved === 'light' || (!saved && prefersLight) ? 'light' : 'dark');
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;700;800&family=Inter:wght@400;500;600&display=swap">
<link rel="preload" as="image" href="{{ site.Data.accueil.hero.image | relURL }}" fetchpriority="high">
{{- $css := resources.Get "css/onepage.css" -}}
{{- if hugo.IsProduction -}}{{- $css = $css | minify | fingerprint -}}{{- else -}}{{- $css = $css | fingerprint -}}{{- end -}}
<link rel="stylesheet" href="{{ $css.RelPermalink }}"{{ if hugo.IsProduction }} integrity="{{ $css.Data.Integrity }}"{{ end }}>
