<header class="site-header">
<div class="container site-header__bar">
<a class="brand" href="{{ "/" | relURL }}#top">
<span class="brand__mark" aria-hidden="true">&gt;_</span>
<span><span class="brand__name">MMI</span> <span class="brand__place">Troyes</span></span>
</a>
<nav class="nav" aria-label="Navigation principale">
{{- range .Site.Menus.main }}
<a class="touch nav__link" href="{{ if (hasPrefix .URL "#") }}{{ if not $.IsHome }}{{ "/" | relURL }}{{ end }}{{ .URL }}{{ else }}{{ .URL | relURL }}{{ end }}">{{ .Name }}</a>
{{- end }}

<!-- Bouton mode clair / sombre -->
<button type="button" id="theme-toggle" class="theme-toggle touch" aria-label="Basculer entre le mode clair et le mode sombre" title="Basculer entre le mode clair et le mode sombre">
  <svg class="icon icon--theme icon-sun" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="5"/>
    <line x1="12" y1="1" x2="12" y2="3"/>
    <line x1="12" y1="21" x2="12" y2="23"/>
    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
    <line x1="1" y1="12" x2="3" y2="12"/>
    <line x1="21" y1="12" x2="23" y2="12"/>
    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
  </svg>
  <svg class="icon icon--theme icon-moon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
  </svg>
</button>

<a class="btn btn--primary btn--pill" href="{{ if not .IsHome }}{{ "/" | relURL }}{{ end }}#candidater">Candidater</a>
</nav>
</div>
</header>
