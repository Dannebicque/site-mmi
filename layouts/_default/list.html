{{ define "main" }}
<section class="section section--ruled">
  <div class="container container--md stack gap-28">
    <div class="section-head">
      <h1>{{ .Title }}</h1>
      {{ with .Description }}<p class="lead">{{ . }}</p>{{ end }}
    </div>
    <div class="stack gap-16">
      {{ range .Pages }}
      <article class="card">
        <h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
        {{ with .Summary }}<p class="muted">{{ . }}</p>{{ end }}
      </article>
      {{ end }}
    </div>
  </div>
</section>
{{ end }}
