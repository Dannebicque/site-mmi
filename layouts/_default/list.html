{{ define "main" }}
{{ partial "onepage/page-head.html" (dict "titre" .Title "texte" .Description) }}
<section class="op-section op-section--tight">
  {{ with .Content }}<div class="op-prose">{{ . }}</div>{{ end }}
  <div class="op-grid3">
    {{ range .Pages }}
    <article class="op-card"><h2 class="op-h3"><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>{{ with .Summary }}<p>{{ . | plainify | truncate 160 }}</p>{{ end }}</article>
    {{ end }}
  </div>
</section>
{{ end }}
