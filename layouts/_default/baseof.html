<!doctype html>
<html lang="{{ or .Site.LanguageCode "fr" }}">
<head>
{{- partial "head.html" . -}}
</head>
<body class="op-inner">
<div class="page">
<a class="op-skip" href="#contenu">Aller au contenu</a>
{{- partial "onepage/header.html" . -}}
<main id="contenu">
{{- block "main" . }}{{- end -}}
</main>
</div>
{{- partial "onepage/footer.html" . -}}
{{- partial "cookie-consent.html" . -}}
{{- $js := resources.Get "js/onepage.js" | minify | fingerprint -}}
<script src="{{ $js.RelPermalink }}" defer></script>
</body>
</html>
