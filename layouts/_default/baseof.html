<!doctype html>
<html lang="{{ or .Site.LanguageCode "fr" }}">
<head>
{{- partial "head.html" . -}}
</head>
<body>
<div id="top" class="page" style="--accent: {{ .Site.Params.accent | default "#B8F53D" }}">
<a class="skip" href="#contenu">Aller au contenu</a>

{{- partial "header.html" . -}}

<main id="contenu">
{{- block "main" . }}{{- end -}}
</main>

{{- partial "footer.html" . -}}

<a href="#top" id="back-to-top" class="back-to-top" aria-label="Retour en haut de page" title="Retour en haut">
  <svg class="icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 15l-6-6-6 6"/>
  </svg>
</a>

<script>
  (function() {
    const btn = document.getElementById('back-to-top');
    if (!btn) return;
    const toggle = () => {
      if (window.scrollY > 300) {
        btn.classList.add('is-visible');
      } else {
        btn.classList.remove('is-visible');
      }
    };
    window.addEventListener('scroll', toggle, { passive: true });
    toggle();
    btn.addEventListener('click', function(e) {
      e.preventDefault();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  })();
</script>

</div>
</body>
</html>
