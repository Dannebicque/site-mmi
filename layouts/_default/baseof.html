<!doctype html>
<html lang="{{ or .Site.LanguageCode "fr" }}">
<head>
{{- partial "head.html" . -}}
</head>
<body>
<div id="top" class="page">
<a class="skip" href="#contenu">Aller au contenu</a>

{{- partial "header.html" . -}}

<main id="contenu">
{{- block "main" . }}{{- end -}}
</main>

{{- partial "footer.html" . -}}

</div>

<!-- Bouton Retour en haut -->
<a href="#top" id="back-to-top" class="back-to-top" aria-label="Retour en haut de page" title="Retour en haut de page">
  <svg class="icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 15l-6-6-6 6"/>
  </svg>
  <span>Haut</span>
</a>

<script>
  (function() {
    const btn = document.getElementById('back-to-top');
    const header = document.querySelector('.site-header');
    const themeBtn = document.getElementById('theme-toggle');
    
    // Bascule du mode clair / sombre
    if (themeBtn) {
      themeBtn.addEventListener('click', function() {
        const current = document.documentElement.getAttribute('data-theme') || 'dark';
        const next = current === 'light' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
      });
    }

    function onScroll() {
      const scrollY = window.pageYOffset || document.documentElement.scrollTop;
      if (btn) {
        if (scrollY > 250) {
          btn.classList.add('is-visible');
        } else {
          btn.classList.remove('is-visible');
        }
      }
      if (header) {
        if (scrollY > 10) {
          header.classList.add('is-scrolled');
        } else {
          header.classList.remove('is-scrolled');
        }
      }
    }
    
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
    
    if (btn) {
      btn.addEventListener('click', function(e) {
        e.preventDefault();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    }
  })();
</script>
</body>
</html>
