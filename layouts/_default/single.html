{{ define "main" }}
<section class="section section--ruled grid-bg">
  <div class="container container--md stack gap-36">
    <div class="section-head">
      <h1 class="h2--xl">{{ .Title }}</h1>
      {{ with .Description }}<p class="lead">{{ . }}</p>{{ end }}
    </div>
    <article class="card" style="padding: clamp(24px, 4vw, 44px); font-size: 16px; line-height: 1.8;">
      {{ .Content }}
    </article>
  </div>
</section>
{{ end }}
