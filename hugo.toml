baseURL = 'https://mmi.iut-troyes.fr/'
languageCode = 'fr-FR'
defaultContentLanguage = 'fr'
title = "BUT MMI Troyes | Métiers du Multimédia et de l'Internet – IUT de Troyes"

disableKinds = ["taxonomy", "term"]
enableRobotsTXT = true

[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.7

[params]
  site_name = "BUT MMI Troyes"
  description = "BUT MMI à l'IUT de Troyes (Université de Reims Champagne-Ardenne) : 3 ans pour apprendre à concevoir, designer, filmer, coder et diffuser. Alternance, stages, candidature Parcoursup ou eCandidat."
  author = "Département MMI – IUT de Troyes"
  og_image = "images/galerie-campus-vie.jpg"
  keywords = ["BUT MMI", "MMI Troyes", "IUT de Troyes", "Université de Reims Champagne-Ardenne", "URCA", "multimédia", "audiovisuel", "développement web", "design UX/UI", "formation bac+3", "alternance", "Parcoursup"]
  accent = "#4C2365"
  theme_color = "#0B0E14"

  # =========================================================================
  # 📅 Journées Portes Ouvertes (JPO) — modifiable ici pour tout le site
  # =========================================================================
  [params.jpo]
    enabled = true
    date = "31 Janvier 2027"
    start_date = "2027-01-31T09:00:00+01:00"
    end_date = "2027-01-31T17:00:00+01:00"
    horaires = "9h00 - 17h00"
    lieu = "IUT de Troyes — Bâtiment MMI"
    text = "Viens voir les studios et rencontrer les étudiants : 31 Janvier 2027."
    badge = "Prochaine JPO : 31 Janvier 2027"
    description = "Viens visiter nos studios de tournage, notre régie son, tester le matériel, rencontrer l'équipe pédagogique et échanger avec les étudiant·es."
    url = "/contact/"

  # =========================================================================
  # 📍 Coordonnées & Contact — modifiable ici (repris sur contact et footer)
  # =========================================================================
  [params.contact]
    institution = "IUT de Troyes"
    department = "Département MMI"
    university = "Université de Reims Champagne-Ardenne"
    address = "9 rue de Québec, CS 90396"
    postal_code = "10026"
    city = "Troyes Cedex"
    full_address = "9 rue de Québec, CS 90396, 10026 Troyes Cedex"
    phone = "+33 (0)3 25 42 46 46"
    phone_clean = "+33325424646"
    email = "mmi-troyes@univ-reims.fr"
    hours = "Du lundi au vendredi : 8h30 - 12h00 / 13h30 - 17h00"
    campus = "Campus des Lombards"
    maps_url = "https://maps.google.com/?q=IUT+de+Troyes+9+rue+de+Quebec"

  # =========================================================================
  # 🔗 Liens externes & plateformes de candidature
  # =========================================================================
  [params.urls]
    parcoursup = "https://www.parcoursup.fr"
    ecandidat = "https://candidatures.iut-troyes.univ-reims.fr"
    iut_troyes = "https://www.univ-reims.fr/iut-troyes/"
    urca = "https://www.univ-reims.fr"
    butmmi = "https://butmmi.fr"

  # =========================================================================
  # 👥 Données chiffrées & KPIs : Équipe pédagogique
  # =========================================================================
  [params.equipe]
    stats = [
      { value = "16", label = "Enseignants permanents", desc = "Universitaires, PRAG, MCF & docteurs" },
      { value = "25+", label = "Intervenants professionnels", desc = "Experts d'agences, directeurs artistiques & développeurs" },
      { value = "3", label = "Pôles d'expertise", desc = "Dév Web & IA, Design UX/UI, Création Audiovisuelle" },
      { value = "100%", label = "Encadrement de proximité", desc = "Suivi en SAÉ, tuteurs dédiés, stages & alternance" }
    ]

  # =========================================================================
  # 🏢 Données chiffrées & KPIs : Locaux & Équipements
  # =========================================================================
  [params.locaux]
    stats = [
      { value = "850 m²", label = "Espaces dédiés", desc = "Plateaux, régies, labos informatiques & créatifs" },
      { value = "120+", label = "Postes informatiques", desc = "Stations pro Mac & PC double écran 27\"" },
